[build-system]
requires = ["setuptools>=72.1.0", "setuptools_scm[toml]>=8.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paramak"
dynamic = ["version"]
description = "Create 3D fusion reactor CAD models based on input parameters"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
authors = [
  { name="The Paramak Development Team" },
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["python", "geometry", "reactor", "model", "cad", "fusion", "parametric", "dagmc", "openmc"]
dependencies = [
    "cadquery>=2.6.0",
    "numpy",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/fusion-energy/paramak"
"Bug Tracker" = "https://github.com/fusion-energy/paramak/issues"
"Documentation" = "https://fusion-energy.github.io/paramak"


[project.optional-dependencies]
tests = [
    "pytest>=5.4.3",
]
# openmc wheels are not on PyPI, install with
# pip install --extra-index-url https://shimwell.github.io/wheels .[transport]
transport = [
    "cad_to_dagmc",
    "openmc>=0.16.1.dev0",
]
docs = [
    "sphinx_autodoc_typehints",
    "sphinx",
    "pydata-sphinx-theme",
    # needed by cadquery.cq_directive
    "ipython",
    "sphinx_design",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools_scm]
write_to = "src/_version.py"

[tool.setuptools]
package-dir = {"" = "src"}
