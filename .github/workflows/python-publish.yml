name: PyPI Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the docs version switcher lists this release
        run: |
          jq -e --arg v "$GITHUB_REF_NAME" 'any(.[]; .version == $v)' docs/version_switcher.json > /dev/null \
            || { echo "::error::$GITHUB_REF_NAME is missing from docs/version_switcher.json"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build package
        run: python -m build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
