name: documentation release

on:
  # builds the docs on every pull request, including ones based on other branches
  # (stacked PRs), they are only deployed on pushes to main and tags
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'


permissions:
  contents: write

jobs:
  test:
    name: Documentation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglx-mesa0 libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libosmesa6 libosmesa6-dev libgles2-mesa-dev libarchive-dev libpangocairo-1.0-0

      - name: checkout actions
        uses: actions/checkout@v4
        with:
          # the full history is needed for setuptools_scm to find the version from the tags
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install dependencies
        run: python -m pip install .[docs]

      # TODO remove once a CadQuery release includes CadQuery/cadquery#2124,
      # which fixes slow vertical rotation in the cq_directive viewer on tall pages
      - name: install CadQuery main branch
        run: python -m pip install git+https://github.com/CadQuery/cadquery.git
      
      # the Sphinx build cache (-d) is kept out of _build so it is not published
      - name: Sphinx build tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          sphinx-build -d /tmp/doctrees/version docs _build/${{ github.ref_name }}
          rm -rf _build/stable
          mkdir -p _build/stable
          sphinx-build -d /tmp/doctrees/stable docs _build/stable
          sphinx-build -b linkcheck -d /tmp/doctrees/linkcheck docs /tmp/linkcheck

      - name: Sphinx build dev version
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && !startsWith(github.ref, 'refs/tags/')
        run: |
          rm -rf _build/dev
          mkdir -p _build/dev
          sphinx-build -d /tmp/doctrees/dev docs _build/dev
          sphinx-build -b linkcheck -d /tmp/doctrees/linkcheck docs /tmp/linkcheck

      # replaces the deployed folders on gh-pages and pushes the branch as a
      # single commit, so it does not build up history, see the script
      - name: Deploy docs to GitHub Pages
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/deploy_docs.sh _build "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
